---
version: 3

# Machine-specific port overrides, so they are set once instead of on every
# command. Optional — the defaults below apply without it. See .env.example.
dotenv: ['.env']

vars:
  COMPOSE: docker compose -f deploy/panel/compose.yaml
  # Pinned alongside dagger.json, which pins the same module for the CI run.
  DAGGER_GO_MODULE: github.com/stuttgart-things/dagger/go@v0.129.4
  GO_VERSION: '1.26.6'
  # Ports. Override any of them if something on the machine already has one:
  #   ZW_PORT=8090 task run
  ZW_PORT: '{{.ZW_PORT | default "8080"}}'
  ZW_SIMULATOR_PORT: '{{.ZW_SIMULATOR_PORT | default "8081"}}'
  # Read by CI out of this file rather than repeated in the workflow, so an
  # artefact rendered by the pipeline comes from the same module version a
  # person publishing by hand would use.
  KCL_MODULE: github.com/stuttgart-things/dagger/kcl@v0.114.0
  KUSTOMIZE_OCI_REPO: ghcr.io/stuttgart-things/zaehlwerk-kustomize
  IMAGE_REPO: ghcr.io/stuttgart-things/zaehlwerk
  ZW_REDIS_PORT: '{{.ZW_REDIS_PORT | default "6379"}}'
  API: http://localhost:{{.ZW_PORT | default "8080"}}
  SIMULATOR: http://localhost:{{.ZW_SIMULATOR_PORT | default "8081"}}

tasks:

  default:
    desc: What to run to see a score on the matrix
    silent: true
    cmds:
      - |
        cat <<'EOF'
        Seeing the score on a matrix, without a matrix:

          task panel:up      # redis + the real led-catcher's web simulator
          task run           # zaehlwerk, in this terminal
          task demo          # in a second terminal: play a match
          task panel:open    # the 64x64 panel in a browser

        Or score it by hand, in a browser:

          task ui            # the scoring page, next to the panel

        Everything else:

          task --list
        EOF

  ## ──────────────────────────────────────────────
  ## THE PANEL
  ## ──────────────────────────────────────────────

  panel:up:
    desc: Start redis and the led-catcher web simulator
    env:
      ZW_SIMULATOR_PORT: '{{.ZW_SIMULATOR_PORT}}'
      ZW_REDIS_PORT: '{{.ZW_REDIS_PORT}}'
    cmds:
      - '{{.COMPOSE}} up -d'
      - task: panel:wait
      - task: panel:ensure-consuming
        vars: {STREAM: '{{.ZW_CATCHER_STREAMS | default "tabletennis"}}'}
      - echo "panel simulator on {{.SIMULATOR}}"

  panel:up:switching:
    desc: Same, but starting on `messages` so the stream switch is visible
    env:
      ZW_SIMULATOR_PORT: '{{.ZW_SIMULATOR_PORT}}'
      ZW_REDIS_PORT: '{{.ZW_REDIS_PORT}}'
      ZW_CATCHER_STREAMS: messages
    cmds:
      - '{{.COMPOSE}} up -d --force-recreate led-catcher redis'
      - task: panel:wait
      - task: panel:ensure-consuming
        vars: {STREAM: messages}
      - |
        echo "catcher started on 'messages'; run zaehlwerk with CATCHER_URL set:"
        echo "  CATCHER_URL={{.SIMULATOR}} task run"
        echo
        echo "note: the panel trails a switch by about a minute —"
        echo "  https://github.com/stuttgart-things/homerun2-led-catcher/issues/56"

  panel:wait:
    internal: true
    silent: true
    cmds:
      - |
        for i in $(seq 1 60); do
          curl -sf {{.SIMULATOR}}/healthz >/dev/null 2>&1 && exit 0
          sleep 1
        done
        echo "the simulator did not come up on {{.SIMULATOR}}" >&2
        exit 1

  panel:ensure-consuming:
    # The catcher does not survive redis being restarted underneath it: it keeps
    # serving HTTP but never starts its consumer again, silently, with nothing
    # in the log after "web simulator started". Changing a published port is
    # enough to cause that, since compose then recreates redis but not the
    # catcher. Cheaper to notice and restart than to debug an empty panel.
    internal: true
    silent: true
    cmds:
      - |
        consuming() {
          {{.COMPOSE}} exec -T redis redis-cli XINFO GROUPS {{.STREAM}} 2>/dev/null             | grep -q homerun2-led-catcher
        }
        for i in $(seq 1 15); do consuming && exit 0; sleep 1; done

        echo "the catcher is up but not consuming {{.STREAM}} — restarting it"
        {{.COMPOSE}} restart led-catcher >/dev/null
        for i in $(seq 1 30); do consuming && exit 0; sleep 1; done
        echo "the catcher still is not consuming {{.STREAM}}; try: task panel:logs" >&2
        exit 1

  panel:restart:
    desc: Restart the catcher, e.g. after redis was recreated under it
    cmds:
      - '{{.COMPOSE}} restart led-catcher'
      - task: panel:wait

  panel:down:
    desc: Stop redis and the simulator
    cmds:
      - '{{.COMPOSE}} down'

  panel:logs:
    desc: Follow the catcher's log — it says what it displayed and why
    cmds:
      - '{{.COMPOSE}} logs -f led-catcher'

  panel:open:
    desc: Open the simulated 64x64 panel in a browser
    cmds:
      - '{{if eq OS "darwin"}}open{{else}}xdg-open{{end}} {{.SIMULATOR}} >/dev/null 2>&1 &'
      - echo "{{.SIMULATOR}}"

  panel:events:
    desc: What the panel has shown, newest first
    silent: true
    cmds:
      - |
        curl -s {{.SIMULATOR}}/api/events | python3 -c '
        import sys, json
        events = json.load(sys.stdin)
        if not events:
            print("nothing on the panel yet")
        for e in events:
            ts, sev = e["timestamp"], e["severity"]
            title, colour = e["title"], e["color"]
            print(f"{ts}  {sev:<8} {title:<10} {colour}")'

  panel:streams:
    desc: Which streams the catcher is subscribed to right now
    silent: true
    cmds:
      - curl -s {{.SIMULATOR}}/streams | python3 -m json.tool

  ## ──────────────────────────────────────────────
  ## THE SERVICE
  ## ──────────────────────────────────────────────

  run:
    desc: Run zaehlwerk against the panel stack (Ctrl-C to stop)
    deps: [port-free]
    env:
      HTTP_ADDR: ':{{.ZW_PORT}}'
      REDIS_ADDR: localhost
      REDIS_PORT: '{{.ZW_REDIS_PORT}}'
      LOG_LEVEL: '{{.LOG_LEVEL | default "INFO"}}'
      ALLOWED_ORIGINS: '{{.ALLOWED_ORIGINS | default "http://localhost:3000"}}'
    cmds:
      - go run ./cmd/zaehlwerk-api

  run:bare:
    desc: Run zaehlwerk on its own — no redis, no panel
    deps: [port-free]
    env:
      HTTP_ADDR: ':{{.ZW_PORT}}'
    cmds:
      - go run ./cmd/zaehlwerk-api

  ## ──────────────────────────────────────────────
  ## PLAYING A MATCH
  ## ──────────────────────────────────────────────

  demo:
    desc: Play a match against a running zaehlwerk, a point every few seconds
    silent: true
    vars:
      PACE: '{{.PACE | default "3"}}'
      PLAYERS: '{{.PLAYERS | default "Anna,Bernd"}}'
    cmds:
      - task: require-api
      - |
        set -eu
        A="$(echo '{{.PLAYERS}}' | cut -d, -f1)"
        B="$(echo '{{.PLAYERS}}' | cut -d, -f2)"
        MATCH=$(curl -sS -X POST {{.API}}/matches \
          -d "{\"players\":[\"$A\",\"$B\"],\"best_of\":3}" \
          | python3 -c 'import sys,json; print(json.load(sys.stdin)["match_id"])')
        echo "match $MATCH — $A vs $B, watch {{.SIMULATOR}}"
        echo

        event=0
        point() {
          event=$((event + 1))
          curl -sS -X POST {{.API}}/ingest/web \
            -d "{\"match_id\":\"$MATCH\",\"source\":\"demo\",\"player\":\"$1\",\"delta\":1,\"event_id\":$event}" \
            | python3 -c '
        import sys, json
        s = json.load(sys.stdin)
        who = s["players"][0] if s["serving"] == "a" else s["players"][1]
        a, b = s["players"]
        pa, pb = s["points"]
        sa, sb = s["sets"]
        print(f"  {a} {pa:>2} : {pb:<2} {b}   sets {sa}:{sb}   serving {who}")'
          sleep {{.PACE}}
        }

        # Set 1 to A through a deuce, set 2 to A. Long enough to show a set win
        # and a match win on the panel, short enough to watch.
        for i in $(seq 1 9); do point a; point b; done
        point a; point a
        for i in $(seq 1 11); do point a; done

        echo
        echo "final: $(curl -sS {{.API}}/matches/$MATCH | python3 -c '
        import sys, json
        s = json.load(sys.stdin)
        a, b = s["players"]
        sa, sb = s["sets"]
        print(f"{a} {sa}:{sb} {b}")')"

  demo:quick:
    desc: A handful of points, as fast as they will go
    silent: true
    cmds:
      - task: require-api
      - |
        set -eu
        MATCH=$(curl -sS -X POST {{.API}}/matches -d '{"players":["Anna","Bernd"]}' \
          | python3 -c 'import sys,json; print(json.load(sys.stdin)["match_id"])')
        echo "match $MATCH"
        for i in 1 2 3 4 5; do
          curl -sS -X POST {{.API}}/ingest/web \
            -d "{\"match_id\":\"$MATCH\",\"source\":\"demo\",\"player\":\"a\",\"delta\":1,\"event_id\":$i}" >/dev/null
        done
        curl -sS {{.API}}/matches/$MATCH | python3 -m json.tool

  ui:
    desc: Open the scoring page — play the match by hand, in a browser
    silent: true
    cmds:
      - task: require-api
      - '{{if eq OS "darwin"}}open{{else}}xdg-open{{end}} {{.API}}/ui >/dev/null 2>&1 &'
      - echo "{{.API}}/ui"

  watch:
    # Not MATCH= — that is a built-in in task v3 (a []string), so a task
    # variable of that name reads back as "[]" and redeclaring it panics
    # the runner outright.
    desc: 'Follow a match''s live SSE stream: task watch ID=<match-id>'
    silent: true
    cmds:
      - task: require-api
      - |
        set -eu
        if [ -z "{{.ID}}" ]; then
          echo "which match? task watch ID=<match-id>" >&2
          echo "the id is printed by 'task demo', and by POST /matches" >&2
          exit 1
        fi
        echo "streaming match {{.ID}} — Ctrl-C to stop"
        curl -sN {{.API}}/matches/{{.ID}}/stream

  port-free:
    # Better here than as a bind error thirty lines into the startup log, which
    # says the port is taken but not what to do about it.
    internal: true
    silent: true
    cmds:
      - |
        if command -v ss >/dev/null 2>&1; then
          ss -tln 2>/dev/null | grep -qE "[:.]{{.ZW_PORT}}\s" || exit 0
        elif command -v lsof >/dev/null 2>&1; then
          lsof -iTCP:{{.ZW_PORT}} -sTCP:LISTEN >/dev/null 2>&1 || exit 0
        else
          exit 0
        fi
        # Suggest a port that is actually free, rather than one that might
        # also be taken.
        free={{.ZW_PORT}}
        for candidate in 8090 8091 8092 9090 9091; do
          if ! ss -tln 2>/dev/null | grep -qE "[:.]${candidate}\s"; then
            free=$candidate
            break
          fi
        done

        # One runnable line per situation, not a two-step. Every one of these
        # ends in `task run`, so it is a single paste to get going.
        echo "port {{.ZW_PORT}} is already in use. Port $free is free:" >&2
        echo >&2
        if [ ! -f .env ]; then
          echo "    echo 'ZW_PORT=$free' >> .env && task run" >&2
        elif grep -qE '^\s*#\s*ZW_PORT=' .env; then
          echo "    sed -i 's/^# *ZW_PORT=.*/ZW_PORT=$free/' .env && task run" >&2
        elif grep -qE '^\s*ZW_PORT=' .env; then
          echo "    sed -i 's/^ZW_PORT=.*/ZW_PORT=$free/' .env && task run" >&2
        else
          echo "    echo 'ZW_PORT=$free' >> .env && task run" >&2
        fi
        echo >&2
        echo "  or just this once:  ZW_PORT=$free task run" >&2
        exit 1

  require-api:
    internal: true
    silent: true
    cmds:
      - |
        curl -sf {{.API}}/healthz >/dev/null 2>&1 && exit 0
        echo "zaehlwerk is not answering on {{.API}} — start it with: task run" >&2
        exit 1

  ## ──────────────────────────────────────────────
  ## CHECKS
  ## ──────────────────────────────────────────────

  test:
    desc: Unit tests with the race detector
    cmds:
      - go test ./... -race

  test:redis:
    desc: Tests including the ones that need a real redis-stack
    silent: true
    cmds:
      - |
        NAME=zaehlwerk-test-redis
        docker rm -f $NAME >/dev/null 2>&1 || true
        docker run -d --name $NAME -p 6399:6379 redis/redis-stack-server:latest >/dev/null
        for i in $(seq 1 40); do
          docker exec $NAME redis-cli ping 2>/dev/null | grep -q PONG && break
          sleep 0.5
        done
        REDIS_TEST_ADDR=localhost:6399 go test ./... -race -cover
        status=$?
        docker rm -f $NAME >/dev/null 2>&1 || true
        exit $status

  cover:
    desc: Coverage per package
    cmds:
      - go test ./... -cover

  lint:
    desc: golangci-lint
    cmds:
      - golangci-lint run ./...

  fmt:
    desc: Format
    cmds:
      - gofmt -w .

  check:
    desc: Everything CI would care about
    cmds:
      - gofmt -l . | (! grep .) || (echo "unformatted files above" >&2; exit 1)
      - go vet ./...
      - task: lint
      - task: test

  ## ──────────────────────────────────────────────
  ## CI, THE WAY IT RUNS IT
  ## ──────────────────────────────────────────────
  ##
  ## Everything below goes through the Dagger module in dagger/, which is what
  ## GitHub Actions calls. They need a `dagger` CLI and a container runtime, and
  ## they are slower than `task check` — the point is reproducing a red CI run
  ## locally, not replacing the fast gate.

  ci:lint:
    desc: golangci-lint, in the container CI uses
    cmds:
      - dagger call -m ./dagger lint --src . --progress plain

  ci:test:
    desc: The suite with -race and a redis-stack, so the panel tests run too
    cmds:
      - dagger call -m ./dagger test --src . --progress plain

  ci:smoke:
    desc: Play a point through the built binary against a real redis
    silent: true
    cmds:
      - |
        dagger call -m ./dagger build-and-test-binary --source . --progress plain \
          export --path=/tmp/zaehlwerk-smoke.log
        cat /tmp/zaehlwerk-smoke.log

  ci:vuln:
    desc: 'Reachable vulnerabilities in the dependency graph; FAIL=true to gate'
    vars:
      FAIL: '{{ .FAIL | default "false" }}'
    silent: true
    cmds:
      - |
        dagger call -m {{ .DAGGER_GO_MODULE }} govulncheck \
          --src . --go-version {{ .GO_VERSION }} \
          --fail-on-finding={{ .FAIL }} --progress plain \
          export --path=/tmp/zaehlwerk-govulncheck.txt
        tail -5 /tmp/zaehlwerk-govulncheck.txt

  ci:image:
    desc: Build the container image with ko and push it to ttl.sh for an hour
    silent: true
    cmds:
      - |
        REPO="ttl.sh/zaehlwerk-$(openssl rand -hex 6)"
        IMAGE=$(dagger call -m ./dagger build-image \
          --src . --repo "$REPO" --push=true --progress plain)
        echo "$IMAGE"

  ## ──────────────────────────────────────────────
  ## KUBERNETES
  ## ──────────────────────────────────────────────

  kcl:render:
    desc: "Render the manifests (PROFILE=base; extra -D after --)"
    vars:
      PROFILE: '{{.PROFILE | default "base"}}'
    cmds:
      - |
        set -e

        # PROFILE takes either a name from kcl/profiles or a path to a file
        # anywhere. The path form is what an environment uses: a profile that
        # names a cluster has no business in this repository, and keeping it
        # outside is what lets the published base stay neutral.
        case "{{.PROFILE}}" in
          */*|*.yaml|*.yml) profile="{{.PROFILE}}" ;;
          *)                profile="kcl/profiles/{{.PROFILE}}.yaml" ;;
        esac
        case "${profile}" in
          "~/"*) profile="${HOME}/${profile#\~/}" ;;
        esac
        [ -f "${profile}" ] || { echo "no profile at ${profile}" >&2; exit 1; }

        # The same conversion stuttgart-things/dagger/kcl does inside its
        # container: a flat key/value file becomes one -D flag per entry. The
        # profiles are NOT kcl settings files — `kcl run -Y profiles/base.yaml`
        # loads none of this and silently renders every default instead, which
        # for secretsMode and httpRouteEnabled is not what any cluster wants.
        set --
        while IFS= read -r kv; do
          [ -n "${kv}" ] && set -- "$@" -D "${kv}"
        done <<PARAMS
        $(yq eval -o=json "${profile}" | jq -r 'to_entries[] | .key + "=" + (.value|tostring)')
        PARAMS

        # And the same normalisation it applies afterwards: drop the
        # "manifests:" key line, turn each list item into a document separator,
        # de-indent by two. Without it the local render is a different artefact
        # from the one that ships — see the note in kcl/main.k.
        #
        # Anything after "--" lands here, AFTER the profile's flags, and a
        # later -D wins:
        #
        #   task kcl:render -- -D config.gatewayName=cilium-gateway
        kcl run kcl/main.k "$@" {{.CLI_ARGS}} \
          | sed 's/^- /---\n/' \
          | sed '1d' \
          | sed 's/^  //' \
          | sed '/^[[:space:]]*$/d' \
          | awk 'NR==1{print "---"} 1'
    silent: true

  kcl:check:
    desc: Do all profiles still render, and does the result parse as Kubernetes YAML?
    silent: true
    cmds:
      - |
        set -e
        status=0
        for p in kcl/profiles/*.yaml; do
          name="$(basename "${p}" .yaml)"
          out="$(task kcl:render PROFILE="${name}" 2>&1)" || {
            echo "FAIL  ${name}"; echo "${out}" | tail -5; status=1; continue
          }
          # A render that emits nothing is a pass to `kcl run` and a useless
          # artefact, so count the documents rather than trusting the exit code.
          n="$(printf '%s\n' "${out}" | yq eval-all '[.] | length' - 2>/dev/null || echo 0)"
          if [ "${n}" -lt 1 ]; then
            echo "FAIL  ${name} — rendered no documents"; status=1; continue
          fi
          printf '%s\n' "${out}" | yq eval-all 'select(.kind == null) | .' - 2>/dev/null | grep -q . && {
            echo "FAIL  ${name} — a document has no kind"; status=1; continue
          }
          echo "ok    ${name} (${n} documents)"
        done
        exit "${status}"

  kcl:apply:
    desc: "Render and apply to the current kube-context (PROFILE=base)"
    vars:
      PROFILE: '{{.PROFILE | default "base"}}'
    cmds:
      # The context is printed rather than pinned: this applies wherever the
      # kubeconfig currently points, and saying so is cheaper than a flag
      # nobody passes.
      - |
        echo "context: $(kubectl config current-context)"
        task kcl:render PROFILE={{.PROFILE}} -- {{.CLI_ARGS}} | kubectl apply -f -
    silent: true

  kcl:publish:
    desc: "Push the kustomize base to GHCR as an OCI artefact (TAG=v1.2.3)"
    silent: true
    cmds:
      - |
        set -eu
        [ -n "{{.TAG}}" ] || { echo "which tag? task kcl:publish TAG=v1.2.3" >&2; exit 1; }

        # The image the base pins is the tag being published, never the
        # profile's ":latest" placeholder — that would resolve to whatever
        # moved last in the registry rather than to this artefact's revision.
        dagger call -m {{.KCL_MODULE}} push-kustomize-base \
          --source kcl \
          --parameters-file kcl/profiles/base.yaml \
          --parameters "config.image={{.IMAGE_REPO}}:{{.TAG}}" \
          --address {{.KUSTOMIZE_OCI_REPO}} \
          --tag "{{.TAG}}" \
          --user env:GITHUB_USER \
          --password env:GITHUB_TOKEN
