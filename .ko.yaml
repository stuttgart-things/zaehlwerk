---
# The binary lives under cmd/, so ko needs to be told; `ko build` is then called
# with ./cmd/zaehlwerk-api as its import path.
defaultBaseImage: cgr.dev/chainguard/static:latest
builds:
  - id: zaehlwerk-api
    main: ./cmd/zaehlwerk-api
    flags:
      - -trimpath
    ldflags:
      - -s
      - -w
      # Stamped into main.version/commit/date and reported by /healthz, so a
      # running pod names its own revision instead of leaving that to a
      # comparison of registry digests.
      #
      # The values come from the shared call-ko-build.yaml, which already
      # exports VERSION (`git describe --tags --always`), COMMIT and
      # BUILD_DATE to the ko step. Nothing upstream had to change; the
      # variables were there before this repository looked for them.
      #
      # `index .Env "…"` rather than `.Env.VERSION`, and the difference is not
      # style: ko renders these with `missingkey=error`, so the field form
      # fails the whole build when the variable is unset — which is every build
      # outside that workflow, including `task ci:image`, because
      # stuttgart-things/dagger/go's KoBuild sets neither. `index` yields an
      # empty string instead, and api.BuildInfo turns that into "dev". Measured
      # against ko 0.18.0, both forms, both ways.
      #
      # Not {{.Git.Tag}}: the shared workflow checks out shallow, and while a
      # shallow clone does carry a tag that sits on the fetched commit, it
      # carries none on a plain push to main — where `git describe` would then
      # find nothing at all. VERSION handles both, because --always falls back
      # to the commit.
      - -X main.version={{index .Env "VERSION"}}
      - -X main.commit={{index .Env "COMMIT"}}
      - -X main.date={{index .Env "BUILD_DATE"}}
