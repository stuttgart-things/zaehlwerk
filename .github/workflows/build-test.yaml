---
name: CI - Dagger Build & Test
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dagger lint
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          module: ./dagger
          call: lint --src . --progress plain

      # With a redis-stack bound, so the panel's integration tests run instead
      # of skipping themselves — and with -race, because every bug worth
      # catching in a scorer read by three observers is a data race.
      - name: Dagger go test
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          module: ./dagger
          call: test --src . --progress plain

      # A point played through the running binary: REST in, Redis out, and the
      # scoring page rendering the score. The seam a green unit suite hides.
      - name: Dagger smoke test
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          module: ./dagger
          call: >-
            build-and-test-binary --source . --progress plain
            export --path ./smoke-test.log

      - name: Upload the smoke test log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-test-log
          path: smoke-test.log
          if-no-files-found: ignore

  # Report-only to start with: nobody has read this repository's first report
  # yet, and a gate whose first run is red teaches people to ignore it. Flip
  # fail-on-finding to true once the list is known and empty.
  govulncheck:
    uses: stuttgart-things/github-workflow-templates/.github/workflows/call-dagger-govulncheck.yaml@main
    with:
      runs-on: ubuntu-latest
      go-version: "1.26.6"
      fail-on-finding: false
    secrets: inherit
