---
name: Build, Push & Scan Container Image
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-pr:
    if: github.event_name == 'pull_request'
    uses: stuttgart-things/github-workflow-templates/.github/workflows/call-ko-build.yaml@main
    with:
      runs-on: ubuntu-latest
      go-version: "1.26.6"
      # The binary is under cmd/, so the default "." would find no package.
      build-path: ./cmd/zaehlwerk-api
      registry: ghcr.io
      tags: pr-${{ github.event.number }}-${{ github.event.pull_request.head.sha }},pr-${{ github.event.number }}
    secrets: inherit # pragma: allowlist secret

  build-main:
    if: github.event_name != 'pull_request'
    uses: stuttgart-things/github-workflow-templates/.github/workflows/call-ko-build.yaml@main
    with:
      runs-on: ubuntu-latest
      go-version: "1.26.6"
      build-path: ./cmd/zaehlwerk-api
      # Named explicitly: without them the template falls back to ttl.sh and
      # latest, and :main would quietly never reach ghcr.io.
      registry: ghcr.io
      # A release is this workflow dispatched at the tag by release-please, so
      # the same job serves both and the ref decides the name. The two
      # namespaces must not touch: a tag publishes the version and moves
      # `latest`, a push to main publishes `main` and moves nothing else.
      tags: >-
        ${{ github.ref_type == 'tag'
            && format('{0},latest', github.ref_name)
            || 'main' }}
    secrets: inherit # pragma: allowlist secret

  # Scans what ko just pushed. Report-only for now — an image scan takes an
  # inventory of a whole artefact, and the first findings are usually
  # transitive; gate on it once the list has been read.
  scan-pr:
    if: github.event_name == 'pull_request'
    needs: build-pr
    uses: stuttgart-things/github-workflow-templates/.github/workflows/call-dagger-trivy-image-scan.yaml@main
    with:
      runs-on: ubuntu-latest
      image-ref: ${{ needs.build-pr.outputs.image-ref }}
      severity: HIGH,CRITICAL
      artifact-name: trivy-image-report-pr-${{ github.event.number }}
      continue-on-error: true

  # The kustomize base carries the image reference, so it can only be built
  # once the image exists — and it must name the tag this run just published,
  # not the ":latest" placeholder the profile carries. That is what
  # kcl-parameters is for; it wins over the profile file.
  #
  # Not on a pull request. A per-PR artefact exists to feed a preview
  # environment, and this service has none: the preview machinery next door
  # serves a database we do not have. `task kcl:publish TAG=…` covers the
  # by-hand case.
  kustomize:
    if: github.event_name != 'pull_request'
    needs: build-main
    uses: stuttgart-things/github-workflow-templates/.github/workflows/call-push-kustomize.yaml@main
    with:
      runs-on: ubuntu-latest
      kcl-source-dir: kcl
      kcl-profile-file: kcl/profiles/base.yaml
      kustomize-oci-repo: ghcr.io/stuttgart-things/zaehlwerk-kustomize
      # One line on purpose. In a folded scalar a more-indented continuation
      # keeps its newline, so splitting this would pass an expression with a
      # line break inside it.
      kcl-parameters: "config.image=ghcr.io/stuttgart-things/zaehlwerk:${{ github.ref_type == 'tag' && github.ref_name || 'main' }}"
      tag: "${{ github.ref_type == 'tag' && github.ref_name || 'main' }}"
      # `latest` moves under exactly the rule the image follows: a tag is a
      # release, a push to main is a snapshot that moves nothing else. Letting
      # the two repositories disagree about what latest means is the one way
      # this pair can still drift once the version tags line up.
      #
      # It is applied with `oras tag` on the digest just pushed, not by
      # publishing a second time — a second publish re-renders the base and
      # lands the two tags on two digests, which is what schmetterpause hit and
      # what stuttgart-things/github-workflow-templates#170 exists to prevent.
      # That workflow proves the tags agree and fails if they do not.
      additional-tags: "${{ github.ref_type == 'tag' && 'latest' || '' }}"
    secrets: inherit # pragma: allowlist secret

  scan-main:
    if: github.event_name != 'pull_request'
    needs: build-main
    uses: stuttgart-things/github-workflow-templates/.github/workflows/call-dagger-trivy-image-scan.yaml@main
    with:
      runs-on: ubuntu-latest
      image-ref: ${{ needs.build-main.outputs.image-ref }}
      severity: HIGH,CRITICAL
      artifact-name: trivy-image-report-${{ github.ref_name }}
      continue-on-error: true
