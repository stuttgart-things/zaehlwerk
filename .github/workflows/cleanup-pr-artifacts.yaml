---
name: Cleanup PR Artifacts
on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  # Removes the pr-<n>-* image and kustomize tags once the PR is closed; the
  # preview ApplicationSet drops the environment at the same time.
  cleanup:
    uses: stuttgart-things/github-workflow-templates/.github/workflows/call-cleanup-pr-artifacts.yaml@main
    with:
      runs-on: ubuntu-latest
      packages: zaehlwerk,zaehlwerk-kustomize,zaehlwerk-piezo
      dry-run: false
    secrets: inherit # pragma: allowlist secret
