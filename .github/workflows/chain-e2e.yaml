---
name: Chain e2e
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # piezo -> zaehlwerk -> Schmetterpause through the real binaries, with the
  # fake Schmetterpause at the far end: the result arrives, a resent event is
  # a duplicate, and a refused result gets through on the page's retry. The
  # script is what `task chain:e2e` runs locally, so a red run here reproduces
  # on a laptop with one command.
  chain:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.6"
          cache-dependency-path: go.sum

      - name: Play the chain
        env:
          E2E_WORK: ${{ runner.temp }}/chain-e2e
        run: tools/chain-mock/e2e.sh

      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chain-e2e-logs
          path: ${{ runner.temp }}/chain-e2e/*.log
          if-no-files-found: ignore
