{{define "live"}}
<div id="live" class="live"{{if .Stream}} hx-ext="sse" sse-connect="/ui/matches/{{.Match.ID}}/stream"{{end}}>
  <section class="card board" id="board" sse-swap="board" hx-swap="innerHTML">
    {{- template "board" . -}}
  </section>
  <section class="card timeline">
    <h2>Panel timeline</h2>
    <div id="log" class="log" sse-swap="log" hx-swap="innerHTML">
      {{- template "log" . -}}
    </div>
  </section>
  {{- /* Outside the board and the log, which the stream swaps, and inside
       #live, which starting a match swaps: the id it asks with is always the
       match on the page. */}}
  {{- if .Follow}}
  <div hidden hx-get="/ui/next?match={{with .Match}}{{.ID}}{{end}}" hx-trigger="every 5s" hx-swap="none"></div>
  {{- end}}
</div>
{{end}}
