# The panel path without a panel: redis-stack plus the real
# homerun2-led-catcher in web-simulator mode, which renders a 64x64 matrix in
# the browser.
#
#   docker compose -f deploy/panel/compose.yaml up -d
#   REDIS_ADDR=localhost go run ./cmd/zaehlwerk-api
#
# Simulator on http://localhost:8081, Redis on localhost:6379. Both host ports
# are overridable, for the common case of already having something on 6379:
#
#   ZW_REDIS_PORT=6380 ZW_SIMULATOR_PORT=8082 docker compose -f deploy/panel/compose.yaml up -d
#   REDIS_ADDR=localhost REDIS_PORT=6380 go run ./cmd/zaehlwerk-api
#
# LED_MODE=full, not web: full also runs the hardware handler, which is a no-op
# for drawing without the rgbmatrix bindings but keeps its blocking sleep. That
# is what makes a display duration that is too long visible here instead of
# only on the Pi.

name: zaehlwerk-panel

services:
  redis:
    image: redis/redis-stack-server:latest
    ports:
      - "${ZW_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  led-catcher:
    image: ghcr.io/stuttgart-things/homerun2-led-catcher:latest
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${ZW_SIMULATOR_PORT:-8081}:8080"
    environment:
      LED_MODE: full
      REDIS_ADDR: redis
      REDIS_PORT: "6379"
      # The stream the catcher starts on. Left as the match stream by default so
      # the panel shows the score straight away; set it to `messages` to watch
      # zaehlwerk take the panel and give it back (CATCHER_URL, ADR-0003).
      REDIS_STREAMS: ${ZW_CATCHER_STREAMS:-tabletennis}
      # The simulator's one-click stream switch, which is also what issue #5
      # will drive over the catcher's API.
      UI_STREAM_PRESETS: "tabletennis,messages,tabletennis|messages"
      PROFILE_PATH: /app/profile.yaml
      LOG_FORMAT: text
      LOG_LEVEL: info
    volumes:
      - ./profile.yaml:/app/profile.yaml:ro

  # zaehlwerk-pong in attract mode, against the zaehlwerk on the host: a demo
  # on the simulated panel once the table has been free for a minute. Only
  # with its profile, so `up -d` alone starts the panel as before:
  #
  #   docker compose -f deploy/panel/compose.yaml --profile pong up -d
  #   REDIS_ADDR=localhost go run ./cmd/zaehlwerk-api
  #
  # Lobby on http://localhost:8087. The image is main's; ZW_PONG_IMAGE takes a
  # release or a pr-<n> tag, and `task chain:pong` runs it from source instead.
  pong:
    image: ${ZW_PONG_IMAGE:-ghcr.io/stuttgart-things/zaehlwerk-pong:main}
    profiles: [pong]
    ports:
      - "${ZW_PONG_PORT:-8087}:8081"
    # zaehlwerk runs on the host, not in here, so the container reaches it
    # through the host's gateway address.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ZAEHLWERK_URL: http://host.docker.internal:${ZW_PORT:-8080}
      PONG_ATTRACT_AFTER: ${ZW_PONG_ATTRACT_AFTER:-1m}
      PONG_ATTRACT_PACE: ${ZW_PONG_ATTRACT_PACE:-1s}
      LOG_LEVEL: INFO
