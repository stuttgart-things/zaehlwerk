# The profile the published kustomize base is rendered from.
#
# Deliberately environment-free: no cluster name, no real hostname, no Vault
# mount. Every value below that names a place is a placeholder an environment
# patches in its Argo Application — the base has to be neutral for that to be
# possible.
#
# What the placeholders do NOT do is switch resources off. Everything is
# rendered, because kustomize can patch a field but cannot patch a resource
# that was never there. That is why httpRouteEnabled is true here even though
# no gateway is named yet, and why secretsMode is external even though no store
# is.
#
# The list of fields an environment has to patch is in the README, as a block
# to copy rather than assemble.

config.namespace: zaehlwerk

# Overridden by task kcl:publish with the tag the artefact itself carries, so
# this never reaches a published base. See the note in schema.k.
config.image: ghcr.io/stuttgart-things/zaehlwerk:latest

# PATCH: the cluster's domain. "zaehlwerk.<clusterDomain>" becomes the HTTPRoute
# hostname.
config.clusterDomain: cluster.example.com

# PATCH: the gateway this cluster exposes, and its namespace.
config.httpRouteEnabled: true
config.gatewayName: gateway
config.gatewayNamespace: default

# PATCH: where the score goes. The two are alternatives and omni-pitcher wins
# where both are set — that is the precedence in main.go, not a rule invented
# here. An environment that has neither runs the scoreboard without a panel,
# which is supported and silent.
config.omniPitcherURL: https://omni-pitcher.example.com
config.redisAddr: ""

# PATCH: the browser origins allowed to read the live stream. Empty means none,
# and never "*" — see internal/api/stream.go. Schmetterpause's origin belongs
# here once its live tab exists.
config.allowedOrigins: ""

# PATCH: the store is named per cluster, pattern vault-<cluster>.
# `kubectl get clustersecretstore` is the reliable source — it is never plain
# "vault". vaultPath is the entry name UNDER the store's mount and nothing
# else; the store already carries the mount, so ESO composes
# <mount>/data/<vaultPath> itself.
config.secretsMode: external
config.secretStoreKind: ClusterSecretStore
config.secretStoreName: vault-cluster
config.vaultPath: zaehlwerk
